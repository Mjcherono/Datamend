# What Datamend measures on every run, diffed against last known-good.
#
# Row counts and null rates are derived from each relation's actual columns, so
# they are not listed here. Only the things needing human judgement are: which
# columns should be unique, and which totals have to reconcile.
#
# These probes catch the shape of the warehouse moving. They do not, on their
# own, catch a single erased subject returning: one person among 25,000 moves a
# row count by 0.004%. That is what the presence sweep in datamend.erasure is
# for, and why the two run together.

relations:
  - name: raw.policyholders
    keys: [person_id]

  - name: raw.policies
    keys: [policy_id]
    reconciliations:
      gross_written_premium: "sum(annual_premium)"

  - name: main_marts.dim_policyholder
    keys: [person_id]

  - name: main_marts.fct_policies
    keys: [policy_id]
    reconciliations:
      gross_written_premium: "sum(annual_premium)"
      policyholders: "count(distinct person_id)"

  - name: main_marts.fct_claims
    keys: [claim_id]
    reconciliations:
      claim_cost: "sum(amount)"
      claimants: "count(distinct person_id)"

  - name: main_marts.agg_claims_by_county
    keys: [county]
    reconciliations:
      claim_cost: "sum(claim_cost)"

  - name: main_marts.agg_premium_by_product
    reconciliations:
      gross_written_premium: "sum(gross_written_premium)"
