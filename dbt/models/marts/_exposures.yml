version: 2

# Blast radius for an erasure failure is read from these. When an erased subject
# reappears, the question a DPO has to answer is not which table they returned
# to, it is who received them. These are the recipients.
exposures:
  - name: broker_portal_extract
    label: Broker Portal Extract
    type: application
    maturity: high
    description: >
      Nightly extract pushed to the broker portal. Leaves the warehouse entirely,
      so a subject who reaches this has been disclosed to a third party.
    depends_on:
      - ref('dim_policyholder')
      - ref('fct_policies')
    owner:
      name: Distribution
      email: distribution@example.ie

  - name: claims_operations_dashboard
    label: Claims Operations Dashboard
    type: dashboard
    maturity: high
    description: Live claims handling view used by the claims team.
    depends_on:
      - ref('fct_claims')
      - ref('dim_policyholder')
    owner:
      name: Claims
      email: claims@example.ie

  - name: board_performance_pack
    label: Board Performance Pack
    type: dashboard
    maturity: high
    description: Monthly performance pack circulated to the board.
    depends_on:
      - ref('agg_premium_by_product')
      - ref('agg_claims_by_county')
    owner:
      name: Finance
      email: finance@example.ie

  - name: solvency_ii_return
    label: Solvency II Regulatory Return
    type: analysis
    maturity: high
    description: >
      Regulatory submission to the Central Bank. Highest consequence consumer:
      a correction here is a conversation with the regulator.
    depends_on:
      - ref('agg_premium_by_product')
      - ref('agg_claims_by_county')
    owner:
      name: Actuarial
      email: actuarial@example.ie
